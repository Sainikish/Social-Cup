spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/socialcup_dev
    username: socialcup
    password: socialcup
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    root: INFO
    com.socialcup: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  security:
    jwt:
      secret: dev-secret-key-change-in-production
  stripe:
    api-key: sk_test_dev_key
  sentry:
    enabled: false
