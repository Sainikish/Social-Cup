spring:
  application:
    name: social-cup
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
  spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

server:
  servlet:
    context-path: /api
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: always
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.socialcup: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
  file:
    name: logs/social-cup.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8081
      - http://localhost:19000
      - http://localhost:19001
      - https://admin-web-nikish1.vercel.app
      - https://barista-web-beta.vercel.app
  rate-limit:
    enabled: true
    max-requests: 100
    window-seconds: 60
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-key-change-in-production}
      access-token-expiry-minutes: 15
      refresh-token-expiry-days: 30
  stripe:
    api-key: ${STRIPE_API_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
    price-id: ${STRIPE_PRICE_ID:price_test_placeholder}
  aws:
    region: ${AWS_REGION:us-east-1}
    s3:
      bucket: ${AWS_S3_BUCKET:socialcup-photos}
      cloudfront-domain: ${AWS_CLOUDFRONT_DOMAIN:cdn.socialcup.app}
    ses:
      sender-email: ${AWS_SES_SENDER:noreply@socialcup.app}
  sentry:
    enabled: ${SENTRY_ENABLED:false}
    dsn: ${SENTRY_DSN:}
    environment: ${SENTRY_ENVIRONMENT:production}
  email:
    verification-link-expiry-hours: 24
    password-reset-link-expiry-hours: 1
